<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sol-app-studio</title>
  <meta name="description" content="sol-app-studio の Android アプリ / Android apps by sol-app-studio">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1d1f; --sub:#5f6368; --accent:#e8710a; --border:rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121314; --card:#1e1f21; --text:#e8eaed; --sub:#9aa0a6; --accent:#f29d4b; --border:rgba(255,255,255,.1); }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
    main { max-width:720px; margin:0 auto; padding:72px 16px 48px; }
    h1 { font-size:2rem; letter-spacing:.02em; }
    h1 span { color:var(--accent); }
    .lead { color:var(--sub); margin-top:8px; }
    section { margin-top:48px; }
    h2 { font-size:1.1rem; margin-bottom:12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
    .muted { color:var(--sub); font-size:.95rem; }
    a { color:var(--accent); }
    footer { margin-top:64px; color:var(--sub); font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1><span>sol</span>-app-studio</h1>
    <p class="lead">毎日の暮らしで使える Android アプリを作っています。<br>We make simple, useful Android apps.</p>

    <section>
      <h2>アプリ / Apps</h2>
      <div class="card">
        <p class="muted">アプリは Google Play で順次公開します。<br>Our apps will be available on Google Play soon.</p>
      </div>
    </section>

    <section>
      <h2>お問い合わせ / Contact</h2>
      <div class="card">
        <p><a href="mailto:n.dev.22c@gmail.com">n.dev.22c@gmail.com</a></p>
      </div>
    </section>

    <footer>© sol-app-studio</footer>
  </main>
</body>
</html>
